name: Windows CAD runtime diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install both supported runtimes in separate environments
        shell: pwsh
        run: |
          python -m pip install 'cadquery-ocp==8.0.1.1.0'
          python -m venv .probe79
          .probe79/Scripts/python.exe -m pip install 'cadquery-ocp==7.9.3.1.1'
      - name: Compare exact STEP conversion with unchanged bounds
        shell: pwsh
        run: python tests/windows-cad-runtime-probe.py (Get-Command python).Source "$pwd/.probe79/Scripts/python.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cad-runtime-diagnostic
          path: tests/evidence/windows-cad-runtime-probe/**

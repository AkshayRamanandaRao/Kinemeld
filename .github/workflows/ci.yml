name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-notices:
    name: Dependency provenance, notices and packaging gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_asset_notices.py
          python scripts/collect_rust_notices.py --check --source-root .
          python -m unittest discover -s scripts -p 'test_*.py'

  solver-and-backend:
    name: Backend, solver checks and interface syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore MBDyn build
        uses: actions/cache@v4
        with:
          path: backend/vendor/mbdyn-1.7.3.tar.gz
          key: mbdyn-1.7.3-${{ runner.os }}-ubuntu22-${{ hashFiles('backend/build_solver.sh') }}
      - name: Build MBDyn 1.7.3
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          MBDYN_JOBS=4 bash backend/build_solver.sh
          echo "{\"mode\":\"native\",\"executable\":\"$PWD/backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn\"}" > backend/solver.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Interface syntax
        run: |
          npm ci
          npm run check
          node --test tests/*.test.mjs
      - name: Backend unit and solver tests
        working-directory: backend
        run: python -m unittest discover -p 'test_*.py'
      - name: Featured studies against independent physics
        working-directory: backend
        run: |
          python -B verify_featured_studies.py
          python -B verify_constraint_analysis.py
          python -B verify_engineering_examples.py
          python -B verify_robot_contact.py
          python -B verify_rotary_control.py "$PWD/vendor/mbdyn-1.7.3/mbdyn/mbdyn"
          python -B verify_flexible_link.py
      - name: Automated robotics and project GUI workflows
        env:
          MBDYN_STUDIO_URL: http://127.0.0.1:8768
        run: |
          npx playwright install --with-deps chromium
          mkdir -p tests/evidence
          export MBDYN_DESIGN_TEST_SOLVER="$PWD/backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn"
          export MBDYN_CONTROL_TEST_SOLVER="$MBDYN_DESIGN_TEST_SOLVER"
          export MBDYN_AGENT_TEST_SOLVER="$MBDYN_DESIGN_TEST_SOLVER"
          python -B backend/server.py --port 8768 > tests/evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python -B - <<'PY'
          import time, urllib.request
          for attempt in range(120):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8768/api/health", timeout=1).close()
                  break
              except OSError:
                  time.sleep(.25)
          else:
              raise SystemExit("GUI server did not start")
          PY
          npm run test:project-safety
          npm run test:cad
          npm run test:agent-workflows
          npm run test:robot-contact
          npm run test:controls
          npm run test:flexible-link
          npm run test:design
          node tests/parameter-study-ui.mjs
      - name: Retain graphical verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robotics-gui-evidence
          path: |
            tests/evidence/**
            verification/rotary-control/verification.json
            examples/*-verification.json

  native:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Check compiler identity against shipped notices
        run: python scripts/collect_rust_notices.py --check --check-compiler --source-root .
      - name: Test
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path native/Cargo.toml --locked --release -p mbdyn-studio-desktop

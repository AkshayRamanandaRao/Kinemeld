name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-notices:
    name: Dependency provenance, notices and packaging gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/check_asset_notices.py
          python scripts/collect_rust_notices.py --check --source-root .
          python -m unittest discover -s scripts -p 'test_*.py'

  solver-and-backend:
    name: Backend, solver checks and interface syntax
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore MBDyn build
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: mbdyn-1.7.3-${{ runner.os }}-ubuntu22-${{ hashFiles('backend/build_solver.sh') }}
      - name: Build MBDyn 1.7.3
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          MBDYN_JOBS=4 bash backend/build_solver.sh
          echo "{\"mode\":\"native\",\"executable\":\"$PWD/backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn\"}" > backend/solver.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Interface syntax
        run: |
          npm ci
          npm run check
      - name: Backend unit and solver tests
        working-directory: backend
        run: python -m unittest discover -p 'test_*.py'
      - name: Featured studies against independent physics
        working-directory: backend
        run: |
          python -B verify_featured_studies.py
          python -B verify_constraint_analysis.py

  native:
    name: Desktop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Check compiler identity against shipped notices
        run: python scripts/collect_rust_notices.py --check --check-compiler --source-root .
      - name: Test
        run: cargo test --manifest-path native/Cargo.toml --locked
      - name: Build
        run: cargo build --manifest-path native/Cargo.toml --locked --release -p mbdyn-studio-desktop

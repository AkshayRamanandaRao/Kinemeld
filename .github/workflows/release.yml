name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.2.0)"
        required: true
      dry_run:
        description: "Build and check the packages without publishing a release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  solver-linux:
    name: MBDyn for Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: mbdyn-1.7.3-${{ runner.os }}-ubuntu22-${{ hashFiles('backend/build_solver.sh') }}
      - run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/kinemeld-source.list >/dev/null
          test -s /etc/apt/sources.list.d/kinemeld-source.list
          sudo apt-get update && sudo apt-get install -y gfortran patchelf
          MBDYN_JOBS=4 bash backend/build_solver.sh
          bash scripts/bundle_solver.sh backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn build/solver
          python3 scripts/collect_solver_sources.py --solver build/solver --sources build/solver-sources
      - uses: actions/upload-artifact@v4
        with:
          name: solver-linux
          path: |
            build/solver
            build/solver-sources

  solver-macos:
    name: MBDyn for macOS
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: mbdyn-1.7.3-macos-15-arm64-${{ hashFiles('backend/build_solver.sh') }}
      - run: |
          brew install gcc
          fortran="$(ls "$(brew --prefix)"/bin/gfortran-* | grep -E 'gfortran-[0-9]+$' | sort -V | tail -1)"
          version="${fortran##*-}"
          # Built on macOS 15; keep the solver itself runnable on macOS 14.
          MACOSX_DEPLOYMENT_TARGET=14.0 CC="gcc-$version" CXX="g++-$version" FC="gfortran-$version" MBDYN_JOBS=3 bash backend/build_solver.sh
          bash scripts/bundle_solver.sh backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn build/solver
          python3 scripts/collect_solver_sources.py --solver build/solver --sources build/solver-sources
      - uses: actions/upload-artifact@v4
        with:
          name: solver-macos
          path: |
            build/solver
            build/solver-sources

  # MBDyn builds on Windows with Cygwin, which supplies the POSIX layer it expects; the Cygwin
  # runtime and GCC DLLs are bundled beside mbdyn.exe.
  solver-windows:
    name: MBDyn for Windows
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --noprofile --norc -eo pipefail -o igncr '{0}'
    steps:
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v4
        with:
          packages: gcc-core gcc-g++ gcc-fortran make python3 tar binutils zstd lzip
      # Restore and save explicitly, so a compiled tree is kept even when bundling fails.
      - uses: actions/cache/restore@v4
        with:
          path: backend/vendor
          key: mbdyn-1.7.3-${{ runner.os }}-cygwin-static-${{ hashFiles('backend/build_solver.sh') }}
      - name: Build
        id: build
        run: |
          # MBDyn's bundled libtool takes gfortran on Cygwin for a non-GNU compiler and archives
          # Fortran libraries with Microsoft's lib; this shim does the same with GNU ar.
          mkdir -p build/lib-shim
          printf '%s\n' '#!/bin/bash' 'out=; objects=()' \
            'for a in "$@"; do case "$a" in -OUT:*) out="${a#-OUT:}" ;; -*) ;; *) objects+=("$a") ;; esac; done' \
            'ar rc "$out" "${objects[@]}" && ranlib "$out"' > build/lib-shim/lib
          chmod +x build/lib-shim/lib
          export PATH="$PWD/build/lib-shim:/usr/bin:$PATH"
          # -std=c++11 hides POSIX functions such as strcasecmp in Cygwin's headers; _GNU_SOURCE
          # makes them visible again without changing the build on other platforms.
          # A static build: with shared libraries, libtool leaves a wrapper in place of mbdyn.exe.
          MBDYN_CONFIGURE_FLAGS=--disable-shared CPPFLAGS=-D_GNU_SOURCE MBDYN_JOBS=4 bash backend/build_solver.sh
      - uses: actions/cache/save@v4
        if: steps.build.outcome == 'success'
        with:
          path: backend/vendor
          key: mbdyn-1.7.3-${{ runner.os }}-cygwin-static-${{ hashFiles('backend/build_solver.sh') }}
      - name: Bundle
        run: |
          export PATH="/usr/bin:$PATH"
          bash scripts/bundle_solver.sh backend/vendor/mbdyn-1.7.3/mbdyn/mbdyn.exe build/solver
          python3 scripts/collect_solver_sources.py --solver build/solver --sources build/solver-sources
          ls -la build/solver/bin
      - name: Check the bundle without Cygwin
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & .\build\solver\bin\mbdyn.exe -v
          if ($LASTEXITCODE -ne 0) { throw "mbdyn.exe exited with $LASTEXITCODE (-1073741515 means a missing DLL)" }
      - uses: actions/upload-artifact@v4
        with:
          name: solver-windows
          path: |
            build/solver
            build/solver-sources

  package:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [solver-linux, solver-macos, solver-windows]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, arch: x86_64, binary: native/target/release/mbdyn-studio-desktop, solver: solver-linux }
          - { os: macos-15, platform: macos, arch: arm64, binary: native/target/release/mbdyn-studio-desktop, solver: solver-macos }
          - { os: windows-latest, platform: windows, arch: x86_64, binary: native/target/release/mbdyn-studio-desktop.exe, solver: solver-windows }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Dependency notices and exact compiler identity
        run: |
          python scripts/check_asset_notices.py
          python scripts/collect_rust_notices.py --check --check-compiler --source-root .
      - name: Build desktop host
        run: cargo build --manifest-path native/Cargo.toml --locked --release -p mbdyn-studio-desktop
      - name: Download bundled solver
        if: matrix.solver != ''
        id: solver
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.solver }}
          path: build
      - name: Package
        shell: bash
        run: |
          python scripts/package_release.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} \
            --binary ${{ matrix.binary }} --version "${VERSION#v}" \
            --solver build/solver --solver-sources build/solver-sources --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  # Each package is unpacked on a fresh runner with only Python installed (plus WebKitGTK and a
  # virtual display on Linux): files against the manifest, the packaged service with an empty
  # user-data folder, real MBDyn runs, and the desktop executable's own self-check.
  verify:
    name: Clean-machine check ${{ matrix.platform }}-${{ matrix.arch }}
    needs: package
    if: always() && needs.package.result != 'cancelled'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, platform: linux, arch: x86_64, ext: tar.gz, solver: --expect-solver, desktop: true }
          - { os: macos-15, platform: macos, arch: arm64, ext: zip, solver: --expect-solver, desktop: true }
          - { os: windows-latest, platform: windows, arch: x86_64, ext: zip, solver: --expect-solver, desktop: true }
    steps:
      - name: Fetch the checker only
        uses: actions/checkout@v4
        with:
          path: checker
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desktop runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
      - name: Files, service and solver
        shell: bash
        run: python checker/scripts/check_package.py dist/Kinemeld-*-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }} --version "${VERSION#v}" ${{ matrix.solver }}
      - name: Desktop self-check
        if: matrix.desktop
        shell: bash
        run: python checker/scripts/check_package.py dist/Kinemeld-*-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.ext }} --version "${VERSION#v}" --native-smoke

  publish:
    name: Publish GitHub release
    needs: [package, verify]
    if: always() && needs.package.result == 'success' && needs.verify.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Attach MBDyn corresponding source (GPL-2.0)
        run: |
          curl -fsSL -o dist/mbdyn-1.7.3.tar.gz https://raw.githubusercontent.com/mmorandi/MBDyn-web/main/userfiles/downloads/mbdyn-1.7.3.tar.gz
          echo "3cf05cd1cb14c1af3d987aac119b6ecf0d835bc1aee06bc4cf7cc5a245c1f36d  dist/mbdyn-1.7.3.tar.gz" | sha256sum -c -
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          notes="docs/releases/${VERSION}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$VERSION" dist/* --title "Kinemeld ${VERSION#v}" --notes-file "$notes" --target "$GITHUB_SHA"
